name: biohub

services:
  mysql:
    image: mysql:8.4
    container_name: biohub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: America/Bogota
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: biohub-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: biohub-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-biohub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-biohub}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  servicio-autorizacion:
    build:
      context: ../services/servicio-autorizacion
    container_name: biohub-servicio-autorizacion
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      BD_HOST: mysql
      BD_PUERTO: 3306
      BD_NOMBRE: auth_db
      BD_USUARIO: auth_user
      BD_CLAVE: auth_pass
      TZ: America/Bogota
    ports:
      - "8082:8082"

  servicio-registro:
    build:
      context: ../services/servicio-registro
    container_name: biohub-servicio-registro
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      BD_HOST: mysql
      BD_PUERTO: 3306
      BD_NOMBRE: registro_db
      BD_USUARIO: registro_user
      BD_CLAVE: registro_pass
      RABBIT_HOST: rabbitmq
      RABBIT_PUERTO: 5672
      RABBIT_USUARIO: ${RABBITMQ_USER:-biohub}
      RABBIT_CLAVE: ${RABBITMQ_PASS:-biohub}
      TZ: America/Bogota
    ports:
      - "8081:8081"

  servicio-consulta-publica:
    build:
      context: ../services/servicio-consulta-publica
    container_name: biohub-servicio-consulta-publica
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      BD_HOST: mysql
      BD_PUERTO: 3306
      BD_NOMBRE: consulta_db
      BD_USUARIO: consulta_user
      BD_CLAVE: consulta_pass
      RABBIT_HOST: rabbitmq
      RABBIT_USUARIO: ${RABBITMQ_USER:-biohub}
      RABBIT_CLAVE: ${RABBITMQ_PASS:-biohub}
      REGISTRO_URL: http://servicio-registro:8081
      AUTORIZACION_URL: http://servicio-autorizacion:8082
      TZ: America/Bogota
    ports:
      - "8083:8083"

  servicio-taxonomia:
    build:
      context: ../services/servicio-taxonomia
    container_name: biohub-servicio-taxonomia
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      MONGO_HOST: mongo
      MONGO_PUERTO: 27017
      MONGO_BD: taxonomia_db
      RABBIT_HOST: rabbitmq
      RABBIT_PUERTO: 5672
      RABBIT_USUARIO: ${RABBITMQ_USER:-biohub}
      RABBIT_CLAVE: ${RABBITMQ_PASS:-biohub}
      TZ: America/Bogota
    ports:
      - "8084:8084"

volumes:
  mysql_data:
  mongo_data:
  rabbitmq_data: