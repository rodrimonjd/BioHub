name: biohub

services:
  mysql:
    image: mysql:8.4
    container_name: biohub-mysql
    restart: unless-stopped
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: America/Bogota
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: biohub-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: biohub-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-biohub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-biohub}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  servicio-autorizacion:
    build:
      context: ../services/servicio-autorizacion
    container_name: biohub-servicio-autorizacion
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      BD_HOST: mysql
      BD_PUERTO: 3306
      BD_NOMBRE: auth_db
      BD_USUARIO: auth_user
      BD_CLAVE: auth_pass
      SECRETO_SERVICIOS: ${SECRETO_SERVICIOS:-biohub-desarrollo}
      TZ: America/Bogota
    volumes:
      - auth_claves:/app/claves
    ports:
      - "8082:8082"

  servicio-registro:
    build:
      context: ../services/servicio-registro
    container_name: biohub-servicio-registro
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      servicio-autorizacion:
        condition: service_started
    environment:
      BD_HOST: mysql
      BD_PUERTO: 3306
      BD_NOMBRE: registro_db
      BD_USUARIO: registro_user
      BD_CLAVE: registro_pass
      RABBIT_HOST: rabbitmq
      RABBIT_PUERTO: 5672
      RABBIT_USUARIO: ${RABBITMQ_USER:-biohub}
      RABBIT_CLAVE: ${RABBITMQ_PASS:-biohub}
      AUTORIZACION_URL: http://servicio-autorizacion:8082
      TZ: America/Bogota
    ports:
      - "8081:8081"

  servicio-consulta-publica:
    build:
      context: ../services/servicio-consulta-publica
    container_name: biohub-servicio-consulta-publica
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      BD_HOST: mysql
      BD_PUERTO: 3306
      BD_NOMBRE: consulta_db
      BD_USUARIO: consulta_user
      BD_CLAVE: consulta_pass
      RABBIT_HOST: rabbitmq
      RABBIT_USUARIO: ${RABBITMQ_USER:-biohub}
      RABBIT_CLAVE: ${RABBITMQ_PASS:-biohub}
      REGISTRO_URL: http://servicio-registro:8081
      AUTORIZACION_URL: http://servicio-autorizacion:8082
      TZ: America/Bogota
    ports:
      - "8083:8083"

  servicio-taxonomia:
    build:
      context: ../services/servicio-taxonomia
    container_name: biohub-servicio-taxonomia
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      servicio-autorizacion:
        condition: service_started
    environment:
      MONGO_HOST: mongo
      MONGO_PUERTO: 27017
      MONGO_BD: taxonomia_db
      AUTORIZACION_URL: http://servicio-autorizacion:8082
      RABBIT_HOST: rabbitmq
      RABBIT_PUERTO: 5672
      RABBIT_USUARIO: ${RABBITMQ_USER:-biohub}
      RABBIT_CLAVE: ${RABBITMQ_PASS:-biohub}
      TZ: America/Bogota
    ports:
      - "8084:8084"

  servicio-reportes:
    build:
      context: ../services/servicio-reportes
    container_name: biohub-servicio-reportes
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      servicio-autorizacion:
        condition: service_started
    environment:
      BD_HOST: mysql
      BD_PUERTO: 3306
      BD_NOMBRE: reportes_db
      BD_USUARIO: reportes_user
      BD_CLAVE: reportes_pass
      RABBIT_HOST: rabbitmq
      RABBIT_PUERTO: 5672
      RABBIT_USUARIO: ${RABBITMQ_USER:-biohub}
      RABBIT_CLAVE: ${RABBITMQ_PASS:-biohub}
      AUTORIZACION_URL: http://servicio-autorizacion:8082
      TZ: America/Bogota
    ports:
      - "8085:8085"

  servicio-historial:
    build:
      context: ../services/servicio-historial
    container_name: biohub-servicio-historial
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      BD_HOST: mysql
      BD_PUERTO: 3306
      BD_NOMBRE: historial_db
      BD_USUARIO: historial_user
      BD_CLAVE: historial_pass
      RABBIT_HOST: rabbitmq
      RABBIT_PUERTO: 5672
      RABBIT_USUARIO: ${RABBITMQ_USER:-biohub}
      RABBIT_CLAVE: ${RABBITMQ_PASS:-biohub}
      AUTORIZACION_URL: http://servicio-autorizacion:8082
      TZ: America/Bogota
    ports:
      - "8086:8086"

  api-gateway:
    build:
      context: ../services/api-gateway
    container_name: biohub-api-gateway
    restart: unless-stopped
    depends_on:
      - servicio-autorizacion
      - servicio-consulta-publica
    environment:
      AUTORIZACION_URL: http://servicio-autorizacion:8082
      CONSULTA_URL: http://servicio-consulta-publica:8083
      SECRETO_SERVICIOS: ${SECRETO_SERVICIOS:-biohub-desarrollo}
      TZ: America/Bogota
    ports:
      - "8080:8080"

  web-app:
    build:
      context: ../services/web-app
    container_name: biohub-web-app
    restart: unless-stopped
    depends_on:
      - servicio-autorizacion
      - servicio-registro
      - servicio-consulta-publica
      - servicio-taxonomia
      - servicio-reportes
      - servicio-historial
      - api-gateway
    environment:
      TZ: America/Bogota
    ports:
      - "3000:3000"

volumes:
  auth_claves:
  mysql_data:
  mongo_data:
  rabbitmq_data: