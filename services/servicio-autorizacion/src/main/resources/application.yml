server:
  port: ${PUERTO_SERVIDOR:8082}

spring:
  application:
    name: servicio-autorizacion
  datasource:
    url: jdbc:mysql://${BD_HOST:localhost}:${BD_PUERTO:3306}/${BD_NOMBRE:auth_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${BD_USUARIO:auth_user}
    password: ${BD_CLAVE:auth_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

identidad:
  clave-archivo: ${IDENTIDAD_CLAVE_ARCHIVO:claves/firma.json}
  emisor: biohub-autorizacion
  duracion-sesion: ${IDENTIDAD_DURACION_SESION:8h}
  duracion-consumidor: 1m
  secreto-servicios: ${SECRETO_SERVICIOS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
