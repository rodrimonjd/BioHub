server:
  port: ${PUERTO_SERVIDOR:8085}

spring:
  application:
    name: servicio-reportes
  web:
    error:
      include-message: always
  datasource:
    url: jdbc:mysql://${BD_HOST:localhost}:${BD_PUERTO:3306}/${BD_NOMBRE:reportes_db}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${BD_USUARIO:reportes_user}
    password: ${BD_CLAVE:reportes_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PUERTO:5672}
    username: ${RABBIT_USUARIO:biohub}
    password: ${RABBIT_CLAVE:biohub}
    listener:
      simple:
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2
        default-requeue-rejected: false

reportes:
  eventos:
    exchange: biohub.eventos
    cola: reportes.avistamientos
    cola-errores: reportes.avistamientos.dlq
  intervalo-generacion-ms: 3000
  autorizacion:
    url: ${AUTORIZACION_URL:http://localhost:8082}
    cache-ttl: 60s

identidad:
  claves-url: ${AUTORIZACION_URL:http://localhost:8082}/api/v1/autorizacion/claves
  emisor: biohub-autorizacion
  espera: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info
