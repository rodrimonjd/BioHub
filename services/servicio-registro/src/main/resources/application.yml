server:
  port: ${PUERTO_SERVIDOR:8081}

spring:
  application:
    name: registro-service
  web:
    error:
      include-message: always
  datasource:
    url: jdbc:mysql://${BD_HOST:localhost}:${BD_PUERTO:3306}/${BD_NOMBRE:registro_db}
    username: ${BD_USUARIO:registro_user}
    password: ${BD_CLAVE:registro_pass}
  jpa:
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PUERTO:5672}
    username: ${RABBIT_USUARIO:biohub}
    password: ${RABBIT_CLAVE:biohub}

biohub:
  eventos:
    exchange: biohub.eventos
    intervalo-ms: 5000
    lote: 50
  # Las escrituras exigen permisos de servicio-autorizacion (cabecera X-Usuario-Id)
  autorizacion:
    url: ${AUTORIZACION_URL:http://localhost:8082}
    cache-ttl: 60s
