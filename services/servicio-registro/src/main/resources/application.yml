server:
  port: 8081

spring:
  application:
    name: registro-service
  web:
    error:
      include-message: always
  datasource:
    url: jdbc:mysql://localhost:3306/registro_db
    username: registro_user
    password: registro_pass
  jpa:
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: localhost
    port: 5672
    username: biohub
    password: biohub

biohub:
  eventos:
    exchange: biohub.eventos
    intervalo-ms: 5000
    lote: 50
