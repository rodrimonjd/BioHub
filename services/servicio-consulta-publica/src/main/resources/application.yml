server:
  port: ${PUERTO_SERVIDOR:8083}

spring:
  application:
    name: servicio-consulta-publica
  datasource:
    url: jdbc:mysql://${BD_HOST:localhost}:${BD_PUERTO:3306}/${BD_NOMBRE:consulta_db}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${BD_USUARIO:consulta_user}
    password: ${BD_CLAVE:consulta_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PUERTO:5672}
    username: ${RABBIT_USUARIO:biohub}
    password: ${RABBIT_CLAVE:biohub}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
        default-requeue-rejected: false

consulta:
  eventos:
    exchange: biohub.eventos
    cola: consulta-publica.hallazgos
    cola-errores: consulta-publica.hallazgos.dlq
  registro-url: ${REGISTRO_URL:http://localhost:8081}
  autorizacion-url: ${AUTORIZACION_URL:http://localhost:8082}
  cache:
    especies-ttl: 5m
    visibilidad-ttl: 60s

identidad:
  claves-url: ${AUTORIZACION_URL:http://localhost:8082}/api/v1/autorizacion/claves
  emisor: biohub-autorizacion
  espera: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info
